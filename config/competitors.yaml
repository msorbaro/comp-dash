# Source of truth for which Instagram accounts we track and how they're grouped.
# Loaded by `python -m scripts.init_db` into the `competitors` / `competitor_groups` tables.
# Built from research/instagram_handles_research.md (2026-09-11 pass).
# website_url added 2026-09-11 for the homepage tracker — verified via search for
# ambiguous ones, high-confidence direct knowledge for the rest; spot-check if unsure.
#
# Shape:
# - name: Display name
#   instagram_handle: handle without the @
#   website_url: homepage URL used for the weekly screenshot tracker
#   facebook_url: optional — explicit Facebook Page URL when known; otherwise
#     defaults to facebook.com/<instagram_handle> in scripts/init_db.py
#   groups: [one or more competitive-set names from Competitors.rtf] (own brands use ["Our Brands"])
#   is_own_brand: true for the user's own brands (tracked the same way, tagged separately
#     so the dashboard can show "us vs. competitors" rather than lumping them in)
#   notes: optional — flags dormancy, ambiguity, or assumptions made on your behalf

