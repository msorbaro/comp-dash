# Customer Voice brand universe - every location gets tagged to exactly one
# of these. `competitor_name` is the exact `competitors.name` value to join
# against (scripts/init_voice_db.py looks it up, doesn't fuzzy-match) -
# omit it for the two brands that don't exist in that table yet (Meineke,
# Tires Plus); the init script adds them there too rather than leaving
# voice.brands.competitor_id null, per user confirmation (2026-09-15).
#
# `aliases` are candidate Google Maps place-name matches, used to tag a
# scraped place to a brand - NOT a guess mechanism. Any place name that
# doesn't confidently match one of these gets reported as unmatched for
# manual review rather than assigned.

# ============================================================
# MAVIS FAMILY (our brands)
# ============================================================

- name: Mavis Discount Tire / Mavis Tires and Brakes
  family: mavis
  competitor_name: Mavis Discount Tire / Mavis Tires and Brakes
  aliases: [Mavis Discount Tire, Mavis Tires & Brakes, Mavis Tires and Brakes, Mavis Tire Supply]

- name: Tire Kingdom
  family: mavis
  competitor_name: Tire Kingdom
  aliases: [Tire Kingdom]

- name: National Tire and Battery
  family: mavis
  competitor_name: National Tire and Battery
  aliases: [National Tire and Battery, National Tire & Battery, NTB]

- name: Pep Boys
