  competitor_name: Pep Boys
  aliases: [Pep Boys, "Pep Boys Auto Service", "Pep Boys - Auto Parts & Service"]

- name: Midas
  family: mavis
  competitor_name: Midas
  aliases: [Midas]

- name: Brakes Plus
  family: mavis
  competitor_name: Brakes Plus
  aliases: [Brakes Plus]

- name: Express Oil Change & Tire Engineers
  family: mavis
  competitor_name: Express Oil
  aliases: [Express Oil, Express Oil Change, "Express Oil Change & Tire Engineers"]

- name: Tuffy
  family: mavis
  competitor_name: Tuffy
  aliases: [Tuffy, "Tuffy Tire & Auto Service", Tuffy Auto Service]

- name: Town Fair Tire
  family: mavis
  competitor_name: Town Fair Tire
  aliases: [Town Fair Tire]

