name: Keep brand-signal awake

# Render's free plan spins the container down after ~15 minutes with no
# inbound HTTP request - a background thread inside the app (the warm-cache
# loop) doesn't count, since it's not an external request. The next real
# visitor then pays for a full cold boot (container start + the app's own
# 20s warm-up delay + the first, uncached compute pass), which is what was
# showing up as "the main page took a minute to load". Pinging the app's
# root path on a schedule generates real inbound traffic so it stays warm
# between visits, without touching the DB or any cached page.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping brand-signal
        run: curl -fsS -o /dev/null -m 30 https://brand-signal.onrender.com/
