# Theme tokens copied from the "Brand Signal" design system
# (new designs/Design System.dc.html) so native widgets (pills, buttons,
# selects, focus rings) pick up the exact brand accent automatically.
[theme]
base = "light"
primaryColor = "#22B8C4"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F8FA"
textColor = "#1A1F26"
font = "sans serif"

[server]
headless = true
